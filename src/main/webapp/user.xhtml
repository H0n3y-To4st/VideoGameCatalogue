<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
        "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html"
      xmlns:f="jakarta.faces.core"
      xmlns:ui="http://java.sun.com/jsf/facelets"
      xmlns:p="http://primefaces.org/ui">

<h:head>
    <title>User Profile</title>
    <h:outputStylesheet name="main.css"/>
    <h:outputStylesheet name="user.css"/>
</h:head>

<ui:include src="navbar.xhtml"/>

<h:body styleClass="dashboard-body">

    //i want to add splash images for them
    <div class="banner-container">
        <div class="banner-image"/>
        <div class="profile-pic"/>
    </div>

    <h:form>
        <div class="user-grid">

            <div class="left-column">

                <h2>Welcome, #{userAccountBean.username}!</h2>

                <div class="fav-genre-container">
                    <h3>Top Rated in Your Favorite Genre: </h3>
                    <h3 class="fav-genre-title">#{userGamesBean.favouriteGenre}</h3>
                </div>

                <ui:repeat value="#{gameBean.getTopGamesByGenre(userGamesBean.favouriteGenre)}" var="game">
                    <div class="game-card">
                        <img src="#{game.thumbCover.url}" alt="Game Cover"/>
                        <h:outputText value="#{game.fullName}" styleClass="game-name"/>
                        <p:commandButton styleClass="user-hidden-button" action="#{gameBean.redirectToGameDetails(game.id)}"/>
                    </div>
                </ui:repeat>
            </div>

            <div class="right-column">
                <div class="stats-block">
                    <h:outputText value="Total Games Saved: #{userGamesBean.games.size()}" styleClass="user-stats"/>
                </div>

                <div class="chart-block" style="height: 500px; width: 500px;">
                    <p:chart value="#{pieChartBean.genreChartModel}"/>
                </div>
            </div>

        </div>
    </h:form>
</h:body>
</html>
