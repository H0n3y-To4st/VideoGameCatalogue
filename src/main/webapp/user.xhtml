<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
        "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html"
      xmlns:f="jakarta.faces.core"
      xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"
      xmlns:ui="http://java.sun.com/jsf/facelets"
      xsi:schemaLocation="http://primefaces.org/ui "
      xmlns:p="http://primefaces.org/ui">
<h:head>
    <title>User Profile</title>
</h:head>

<h:outputStylesheet name="main.css"/>
<h:outputStylesheet name="user.css"/>

<ui:include src="navbar.xhtml"/>

<body>
<div>
    <h:outputText value="User Profile"/>
</div>
<h:form>
    <h:panelGrid columns="1">
        <!--    TODO: learn how to add user profiles? link to their profile? -->
        <h:outputText value="Welcome, #{userAccountBean.username}!"/>
        <h:outputText value="Big things coming soon! :D"/>
    </h:panelGrid>

<!--    TODO: recently added games? (can usergameid to display last games saved)-->
<!--    TODO: user game like stats in terms of game genres saved?-->
<!--    TODO: game recommendations?-->
    <h:form>
        <h:panelGrid columns="2" cellpadding="10">
            <h:outputText value="Total Games Saved: #{userGamesBean.games.size()}" styleClass="user-stats"/>
        </h:panelGrid>

        <div style="height: 500px; width: 500px; color:white;">
            <p:chart value="#{pieChartBean.genreChartModel}"/>
        </div>

        <h:panelGroup>
            <h:outputText value="Recently Added Games:" styleClass="section-title"/>
        </h:panelGroup>

        <h:panelGroup>
            <h:outputText value="Recommended Games:" styleClass="section-title"/>
        </h:panelGroup>
    </h:form>
</h:form>
</body>
</html>
