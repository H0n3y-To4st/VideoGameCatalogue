<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
        "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html"
      xmlns:f="jakarta.faces.core"
      xmlns:p="http://primefaces.org/ui"
      xmlns:ui="http://java.sun.com/jsf/facelets">

<h:head>
    <title>Search</title>
</h:head>

<h:outputStylesheet name="main.css"/>
<h:outputStylesheet name="search.css"/>

<ui:include src="../navbar.xhtml"/>

<h:body>
    <div class="container">

        <h:form id="searchForm">
            <div class="title">
                <h2>Advanced Search Results</h2>
                <p:inputText id="searchQuery" value="#{gameSearchBean.searchQuery}" placeholder="Search for a game"/>
                <p:commandButton icon="pi pi-search" value="Search"
                                 action="#{gameSearchBean.searchGamesByName(gameSearchBean.searchQuery)}"
                                 update="searchResultsTable" process="@form"/>
            </div>

            <br/>
            <br/>

            <div class="searchContainer">
                <p:dataTable id="searchResultsTable" value="#{gameSearchBean.searchResults}" var="game"
                             selectionMode="single"
                             selection="#{gameBean.selectedGame}" rowKey="#{game.id}"
                             paginator="true" paginatorPosition="bottom"
                             paginatorTemplate="{CurrentPageReport} {FirstPageLink} {PreviousPageLink} {PageLinks} {NextPageLink} {LastPageLink} {RowsPerPageDropdown}"
                             currentPageReportTemplate="{startRecord}-{endRecord} of {totalRecords} records"
                             rowsPerPageTemplate="5,10,{ShowAll|'All'}">

                    <p:ajax event="rowSelect" listener="#{gameBean.onGameSelect}">
                        <f:attribute name="gameId" value="#{game.id}"/>
                    </p:ajax>

                    <p:column headerText="Cover">
                        <h:graphicImage value="#{game.thumbCover.url}" alt="Game Cover"/>
                    </p:column>
                    <p:column headerText="Game Name">
                        <h:outputText value="#{game.name}"/>
                    </p:column>
                </p:dataTable>
            </div>
        </h:form>
        <!--    TODO: Make this scroll with user view-->
        <h:form id="gameFilter">
            <div class="filterContainer">
                        <p:selectCheckboxMenu label="Genres" value="#{gameSearchBean.selectedGenres}">
                        <f:selectItems value="#{gameSearchBean.genres}" var="genre" itemValue="#{genre}" itemLabel="#{genre}" />
                        <p:ajax event="change" listener="#{gameSearchBean.searchGamesByName(gameSearchBean.searchQuery)}" process="@this" update=":searchForm:searchResultsTable"/>
                    </p:selectCheckboxMenu>
                        <p:selectCheckboxMenu label="Platforms" value="#{gameSearchBean.selectedPlatforms}">
                            <f:selectItems value="#{gameSearchBean.platforms}" var="platforms" itemValue="#{platforms}" itemLabel="#{platforms}" />
                            <p:ajax event="change" listener="#{gameSearchBean.searchGamesByName(gameSearchBean.searchQuery)}" process="@this" update=":searchForm:searchResultsTable"/>
                        </p:selectCheckboxMenu>
                        <p:selectCheckboxMenu label="GameModes" value="#{gameSearchBean.selectedGameModes}">
                            <f:selectItems value="#{gameSearchBean.gameModes}" var="gameModes" itemValue="#{gameModes}" itemLabel="#{gameModes}" />
                            <p:ajax event="change" listener="#{gameSearchBean.searchGamesByName(gameSearchBean.searchQuery)}" process="@this" update=":searchForm:searchResultsTable"/>
                        </p:selectCheckboxMenu>
            </div>
        </h:form>
    </div>
</h:body>
</html>
