<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
        "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html"
      xmlns:f="jakarta.faces.core"
      xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"
      xmlns:ui="http://java.sun.com/jsf/facelets"
      xsi:schemaLocation="http://primefaces.org/ui "
      xmlns:p="http://primefaces.org/ui">
<h:head>
    <title>Game page</title>
    <style type="">
        body {
            background: linear-gradient(rgba(0, 0, 0, 0.5), rgba(0, 0, 0, 0.5)), url("#{gameBean.selectedGame.getBackgroundImageUrl(gameBean.selectedGame)}") no-repeat center center fixed;
            background-size: cover;
        }
    </style>
</h:head>

<h:outputStylesheet name="main.css"/>
<h:outputStylesheet name="game.css"/>

<ui:include src="../navbar.xhtml"/>

<body>
<f:metadata>
    <f:viewAction action="#{gameBean.loadGameDetails}"/>
</f:metadata>
<h:form styleClass="game-overview">
    <div class="game-header">
        <h:panelGrid columns="2" width="100%">
            <h:outputText value="#{gameBean.selectedGame.fullName} | (#{gameBean.selectedGame.gameReleaseYear})"
                          styleClass="game-title"/>
            <h:panelGroup style="float: right;">
                <p:commandButton value="Save" styleClass="game-save-remove-button"
                                 rendered="#{userAccountBean.checkLoggedIn()}"
                                 update="gameStateForm:menu"
                                 onclick="PF('gameDialog').show();"/>
            </h:panelGroup>
            <ui:repeat value="#{gameBean.selectedGame.involved_companies}" var="companies" backgroundColor="white">
                <h:outputText value="#{companies.company.name}" styleClass="company-name"/>
            </ui:repeat>
        </h:panelGrid>
    </div>

<!--    <h:panelGrid columns="2" styleClass="" cellpadding="0px" width="100%">-->
<!--        <p:knob value="#{gameBean.selectedGame.rating}" disabled="true"-->
<!--                foregroundColor="green" backgroundColor="white" style="float: right;" width="100px" height="100px"/>-->
<!--    </h:panelGrid>-->
    <div class="cover-and-screenshots">
        <h:panelGrid columns="2" style="" cellpadding="0">
            <h:graphicImage
                    value="#{gameBean.selectedGame.cover.url}"
                    alt="Game Cover"
                    style="margin-left: 50%;"/>

            <p:galleria value="#{gameBean.selectedGame.screenshots}" var="screenshot" numVisible="5"
                        style="max-width: 60%; margin: auto;">
                <img src="#{gameBean.selectedGame.getBigScreenshot(screenshot).url}" alt="Missing screenshot"
                     style="width: 100%;" />
                <f:facet name="thumbnail">
                    <img src="#{screenshot.url}" alt="Missing screenshot" />
                </f:facet>
            </p:galleria>
        </h:panelGrid>
    </div>

    <div class="game-details">
        <h:panelGrid columns="3" styleClass="">
            <h:panelGrid>
                <h:outputText value="#{gameBean.selectedGame.summary}" style="" colspan="3"
                              backgroundColor="white"/>
                <h:outputText value="Genres:" styleClass=""/>
                <ui:repeat value="#{gameBean.selectedGame.genres}" var="genre" colspan="2" backgroundColor="white">
                    <h:outputText value="#{genre.name}" styleClass="genre-names"/>
                </ui:repeat>
            </h:panelGrid>
        </h:panelGrid>
    </div>

</h:form>

    <p:dialog header="Select Game Collections" widgetVar="gameDialog" modal="true" resizable="false">
        <h:form id="gameStateForm">
            <h:outputText value="Select the collections you want to save this game to"/>
            <br/>
            <p:selectCheckboxMenu id="menu"
                                  label="Collections"
                                  value="#{userGameStatesBean.selectedGameStates}">
                <f:selectItems value="#{userGameStatesBean.gameStates}" var="state" itemValue="#{state}" itemLabel="#{state}" />
            </p:selectCheckboxMenu>
            <p:commandButton icon="pi pi-check" value="Save"
                             action="#{userGamesBean.saveGameAndStates(gameBean.selectedGame.id)}"
                             update=":gameStateForm:menu"
                             oncomplete="PF('gameDialog').hide();"/>
        </h:form>
    </p:dialog>
</body>
</html>
